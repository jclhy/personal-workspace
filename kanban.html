const PWD_HASH = 'b961b62afaad57c885b92af580d6611a0729a0dca1cd15bad2dd61f6a77d3ecf';

async function sha256(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

async function checkPassword() {
  const input = document.getElementById('pwdInput').value;
  const hash = await sha256(input);
  if (hash === PWD_HASH) {
    sessionStorage.setItem('kanban_auth', '1');
    document.getElementById('loginOverlay').style.display = 'none';
    document.getElementById('appContent').style.display = 'block';
    loadArchiveData();
  } else {
    document.getElementById('loginError').textContent = '密码不正确，请重试';
    document.getElementById('pwdInput').value = '';
    document.getElementById('pwdInput').focus();
  }
}

document.addEventListener('DOMContentLoaded', function() {
  document.getElementById('pwdInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') checkPassword();
  });
  if (sessionStorage.getItem('kanban_auth') === '1') {

// ========== 日历数据 ==========
function getCalendarData(year, month) {
  const firstDay = new Date(year, month, 1);
  const lastDay = new Date(year, month + 1, 0);
  const prevLastDay = new Date(year, month, 0);
  const startDay = firstDay.getDay();
  const daysInMonth = lastDay.getDate();
  const daysInPrevMonth = prevLastDay.getDate();
  
  const today = new Date();
  const calendar = [];
  
  // 添加上月日期
  for (let i = startDay - 1; i >= 0; i--) {
    calendar.push({
      day: daysInPrevMonth - i,
      isCurrentMonth: false,
      isToday: false,
      hasEvent: false
    });
  }
  
  // 添加本月日期
  for (let day = 1; day <= daysInMonth; day++) {
    calendar.push({
      day: day,
      isCurrentMonth: true,
      isToday: today.getFullYear() === year && today.getMonth() === month && day === today.getDate(),
      hasEvent: false // 可扩展：关联日历任务
    });
  }
  
  // 填充下月日期（使网格完整）
  const totalCells = calendar.length;
  const remaining = 42 - totalCells; // 6周 * 7天
  for (let i = 1; i <= remaining; i++) {
    calendar.push({
      day: i,
      isCurrentMonth: false,
      isToday: false,
      hasEvent: false
    });
  }
  
  return { calendar, firstDay, lastDay };
}

// ========== 渲染今日待办 ==========
function renderTodayTasks() {
  const container = document.getElementById('todayTasks');
  container.innerHTML = TODAY_TASKS.map(t => `
    <div class="today-item" onclick="this.classList.toggle('completed')">
      <div class="today-id">${t.id}</div>
      <div class="today-title">${t.title}</div>
      <div class="today-desc">${t.desc}</div>
    </div>
  `).join('');
}

// ========== 渲染日历 ==========
function renderCalendar() {
  const now = new Date();
  const year = now.getFullYear();
  const month = now.getMonth();
  const { calendar, firstDay, lastDay } = getCalendarData(year, month);
  
  const monthNames = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  const dayNames = ['日','一','二','三','四','五','六'];
  
  let html = '';
  // 表头
  html += '<div class="calendar-day-header">日</div>';
  for (let i = 1; i < 7; i++) {
    html += `<div class="calendar-day-header">${dayNames[i]}</div>`;
  }
  
  // 日期网格
  calendar.forEach(item => {
    const className = ['calendar-day'];
    if (item.isToday) className.push('today');
    if (item.hasEvent) className.push('has-event');
    if (!item.isCurrentMonth) className.push('other-month');
    
    html += `<div class="${className.join(' ')}" title="${item.isCurrentMonth ? `${monthNames[month]}${item.day}` : ''}">${item.day}</div>`;
  });
  
  document.getElementById('calendarGrid').innerHTML = html;
}

function populateArchiveMonths() {
  const months = [...new Set(ARCHIVED_TASKS.map(t => t.archived_date?.substring(0, 7) || 'unknown'))].sort().reverse();
  const select = document.getElementById('archiveMonthFilter');
  months.forEach(m => {
    const opt = document.createElement('option');
    opt.value = m;
    opt.textContent = m === 'unknown' ? '未知日期' : m + '月';
    select.appendChild(opt);
  });
}

function renderArchive() {
  const monthFilter = document.getElementById('archiveMonthFilter').value;
  const search = document.getElementById('archiveSearchBox').value.toLowerCase();
  
  let filtered = ARCHIVED_TASKS;
  if (monthFilter) {
    filtered = filtered.filter(t => (t.archived_date || '').startsWith(monthFilter));
  }
  if (search) {
    filtered = filtered.filter(t => 
      t.id.toLowerCase().includes(search) || 
      t.name.toLowerCase().includes(search) ||
      (t.project || '').toLowerCase().includes(search) ||
      (t.note || '').toLowerCase().includes(search)
    );
  }
  
  const container = document.getElementById('archiveTableContainer');
  
  if (filtered.length === 0) {
    container.innerHTML = '<div class="archive-empty">📭 暂无匹配的归档任务</div>';
    return;
  }
  
  const statusBadge = (status) => {
    const map = {
      '已完成': 'status-completed',
      '已封存': 'status-paused',
      '暂停': 'status-paused'
    };
    return `<span class="meta-tag ${map[status] || ''}">${status}</span>`;
  };
  
  let html = `<table class="archive-table">
    <thead>
      <tr>
        <th>ID</th>
        <th>任务名称</th>
        <th>状态</th>
        <th>优先级</th>
        <th>所属项目</th>
        <th>归档日期</th>
      </tr>
    </thead>
    <tbody>`;
  
  filtered.sort((a, b) => (b.archived_date || '').localeCompare(a.archived_date || ''));
  
  filtered.forEach(t => {
    html += `<tr>
      <td><strong>${t.id}</strong></td>
      <td>${t.name}</td>
      <td>${statusBadge(t.status)}</td>
      <td>${t.priority}</td>
      <td>${t.project || '—'}</td>
      <td>${t.archived_date || '—'}</td>
    </tr>`;
  });
  
  html += '</tbody></table>';
  html += `<div style="margin-top:12px;font-size:12px;color:#86868b;">共 ${filtered.length} 条归档记录</div>`;
  
  container.innerHTML = html;
}

function toggleArchive() {
  const panel = document.getElementById('archivePanel');
  const mainContent = document.getElementById('mainContent');
  const isArchiveVisible = panel.style.display === 'block';
  
  if (isArchiveVisible) {
    panel.style.display = 'none';
    mainContent.style.display = 'block';
  } else {
    mainContent.style.display = 'none';
    panel.style.display = 'block';
  }
}

const SECTIONS = [
  { cat:"E", title:"消耗型任务", subtitle:"必须做，优先清掉", icon:"🔥", color:"#c41e3a" },
  { cat:"C", title:"建设型·内容资产", subtitle:"长期价值最高", icon:"📚", color:"#ff9500" },
  { cat:"T", title:"建设型·技术项目", subtitle:"产品与技术", icon:"⚙️", color:"#2557a7" },

  { cat:"B", title:"建设型·商业变现", subtitle:"收入与客户", icon:"💰", color:"#af52de" },
  { cat:"D", title:"已完成/维持型", subtitle:"保持运行即可", icon:"✅", color:"#8e8e93" },

const STATUS_MAP = { "✅":"completed", "⏳":"inprogress", "🔴":"pending", "❌":"notstarted", "⏸️":"paused", "⚠️":"deferred" };
const PRIORITY_MAP = { "P0":"p0", "P1":"p1", "P2":"p2", "P3":"p3", "暂缓":"deferred" };

function renderDevSection() {
  const catColor = "#7b2d8e";
  let cardsHtml = DEV_PROJECTS.map(t => {
    const sc = t.status === "🔄" ? "inprogress" : (STATUS_MAP[t.status]||"pending");
    let detailsHtml = '';
    if (t.details && Object.keys(t.details).length > 0) {
      detailsHtml = '<div class="card-details">';
      for (const [k,v] of Object.entries(t.details)) {
        detailsHtml += `<div><span class="detail-label">${k}：</span>${v}</div>`;
      }
      detailsHtml += '</div>';
    }
    return `
      <div class="card" data-id="${t.id}" data-cat="${t.cat}" data-status="${t.status}" data-search="${t.title} ${t.desc} ${t.env} ${t.tool}">
        <div class="card-top">
          <span class="card-id" style="background:${catColor}">${t.id}</span>
          <span class="meta-tag status-${sc}">${t.status} ${t.statusLabel}</span>
        </div>
        <div class="card-title">${t.title}</div>
        <div class="card-desc">${t.desc}</div>
        <div class="card-meta">
          <span class="meta-tag owner-tag">💻 ${t.env}</span>
          <span class="meta-tag source-tag">🔧 ${t.tool}</span>
        </div>
        ${detailsHtml}
      </div>`;
  }).join('');
  
  return `<div class="section" data-cat="DEV">
    <div class="section-header" onclick="toggleSection(this)">
      <div class="section-icon" style="background:${catColor}">🛠️</div>
      <h2>开发项目与Agent管理</h2>
      <span class="section-count">${DEV_PROJECTS.length}项</span>
      <span class="section-subtitle" style="font-size:13px;color:#86868b;margin-left:8px">项目、设备、工具环境索引</span>
      <span class="section-toggle">▼ 收起</span>
    </div>
    <div class="cards">${cardsHtml}</div>
  </div>`;
}

function renderStats(filtered) {
  const total = filtered.length;
  const completed = filtered.filter(t=>t.status==="✅").length;
  const inprogress = filtered.filter(t=>t.status==="⏳").length;
  const pending = filtered.filter(t=>t.status==="🔴"||t.status==="❌").length;
  const archivedCount = ARCHIVED_TASKS.length;
  document.getElementById('statsBar').innerHTML = `
    <div class="stat-chip total"><span class="num">${total}</span>活跃</div>
    <div class="stat-chip completed"><span class="num">${completed}</span>已完成</div>
    <div class="stat-chip inprogress"><span class="num">${inprogress}</span>进行中</div>
    <div class="stat-chip pending"><span class="num">${pending}</span>待推进</div>
    <div class="stat-chip archived"><span class="num">${archivedCount}</span>已归档</div>
  `;
}

function renderCard(t) {
  const sc = STATUS_MAP[t.status]||"pending";
  const pc = PRIORITY_MAP[t.priority]||"p3";
  const catColor = SECTIONS.find(s=>s.cat===t.cat)?.color||"#999";
  
  if (t.cat === "DEV") {
    let detailsHtml = '';
    if (t.details && Object.keys(t.details).length > 0) {
      detailsHtml = '<div class="card-details">';
      for (const [k,v] of Object.entries(t.details)) {
        detailsHtml += `<div><span class="detail-label">${k}：</span>${v}</div>`;
      }
      detailsHtml += '</div>';
    }
    return `
      <div class="card" data-id="${t.id}" data-cat="${t.cat}" data-status="${t.status}" data-search="${t.title} ${t.desc} ${t.env} ${t.tool}">
        <div class="card-top">
          <span class="card-id" style="background:${catColor}">${t.id}</span>
          <span class="meta-tag status-${sc}">${t.status} ${t.statusLabel}</span>
        </div>
        <div class="card-title">${t.title}</div>
        <div class="card-desc">${t.desc}</div>
        <div class="card-meta">
          <span class="meta-tag owner-tag">💻 ${t.env}</span>
          <span class="meta-tag source-tag">🔧 ${t.tool}</span>
        </div>
        ${detailsHtml}
      </div>`;
  }
  
  let detailsHtml = '';
  if (t.details) {
    detailsHtml = '<div class="card-details">';
    for (const [k,v] of Object.entries(t.details)) {
      detailsHtml += `<div><span class="detail-label">${k}：</span>${v}</div>`;
    }
    detailsHtml += '</div>';
  }
  return `
    <div class="card" data-id="${t.id}" data-cat="${t.cat}" data-status="${t.status}" data-priority="${t.priority}" data-owner="${t.owner}" data-search="${t.title} ${t.desc} ${t.owner} ${t.id}">
      <div class="card-top">
        <span class="card-id" style="background:${catColor}">${t.id}</span>
        <span class="meta-tag status-${sc}">${t.status} ${t.statusLabel}</span>
      </div>
      <div class="card-title">${t.title}</div>
      <div class="card-desc">${t.desc}</div>
      <div class="card-meta">
        <span class="meta-tag priority-${pc}">${t.priority==='暂缓'?'⏸️ 暂缓':'🎯 '+t.priority}</span>
        ${t.owner!=='—'?`<span class="meta-tag owner-tag">👤 ${t.owner}</span>`:''}
      </div>
      ${detailsHtml}
    </div>`;
}

function renderAll(filtered) {
  if (!filtered) filtered = TASKS;
  renderStats(filtered);
  const main = document.getElementById('mainContent');
  let html = '';
  let hasResult = false;
  
  const devHtml = renderDevSection();
  if (devHtml) {
    hasResult = true;
    html += devHtml;
  }
  
  for (const sec of SECTIONS) {
    const secTasks = filtered.filter(t=>t.cat===sec.cat);
    if (secTasks.length === 0) continue;
    hasResult = true;
    html += `<div class="section" data-cat="${sec.cat}">
      <div class="section-header" onclick="toggleSection(this)">
        <div class="section-icon" style="background:${sec.color}">${sec.icon}</div>
        <h2>${sec.title}</h2>
        <span class="section-count">${secTasks.length}项</span>
        <span class="section-subtitle" style="font-size:13px;color:#86868b;margin-left:8px">${sec.subtitle}</span>
        <span class="section-toggle">▼ 收起</span>
      </div>
      <div class="cards">${secTasks.map(renderCard).join('')}</div>
    </div>`;
  }
  if (!hasResult) html = '<div class="no-results">🔍 没有匹配的任务，试试调整筛选条件</div>';
  main.innerHTML = html;
}

function toggleSection(header) {
  const section = header.parentElement;
  section.classList.toggle('collapsed');
  const toggle = header.querySelector('.section-toggle');
  toggle.textContent = section.classList.contains('collapsed') ? '▶ 展开' : '▼ 收起';
}

function filterCards() {
  const search = document.getElementById('searchBox').value.toLowerCase();
  const status = document.getElementById('statusFilter').value;
  const priority = document.getElementById('priorityFilter').value;
  const owner = document.getElementById('ownerFilter').value;
  const category = document.getElementById('categoryFilter').value;
  const view = document.getElementById('viewFilter').value;
  
  const taskTypeMap = {
    'L-01': 'personal', 'L-02': 'personal', 'L-03': 'personal',
    'D-01': 'personal', 'D-02': 'personal', 'D-03': 'personal',
    'DEV-02': 'personal',
    'E-02': 'business', 'E-03': 'business', 'E-04': 'business', 'E-05': 'business', 'E-06': 'business', 'E-07': 'business', 'E-08': 'business', 'E-09': 'business', 'E-10': 'business',
    'C-01': 'business', 'C-02': 'business', 'C-03': 'business', 'C-04': 'business', 'C-05': 'business', 'C-06': 'business', 'C-07': 'business',
    'T-01': 'business', 'T-03': 'business', 'T-04': 'business', 'T-05': 'business', 'T-06': 'business',
    'ED-01': 'business', 'ED-02': 'business', 'ED-03': 'business', 'ED-04': 'business', 'ED-05': 'business', 'ED-06': 'business',
    'T-04-M01': 'business', 'T-04-M02': 'business', 'T-04-M03': 'business', 'T-04-M04': 'business', 'T-04-M05': 'business',
    'T-04-M06': 'business', 'T-04-M07': 'business', 'T-04-M08': 'business', 'T-04-M09': 'business', 'T-04-M10': 'business',
    'T-04-M11': 'business', 'T-04-M12': 'business', 'T-04-M13': 'business', 'T-04-M14': 'business', 'T-04-M15': 'business',
    'B-01': 'business', 'B-03': 'business', 'B-04': 'business', 'B-05': 'business',
    'DEV-01': 'business', 'DEV-04': 'business', 'DEV-05': 'business', 'DEV-06': 'business', 'DEV-07': 'business'
  };
  
  const filtered = TASKS.filter(t => {
    if (search && !(t.id.toLowerCase().includes(search) || t.title.toLowerCase().includes(search) || t.desc.toLowerCase().includes(search) || t.owner.includes(search))) return false;
    if (status && t.status !== status) return false;
    if (priority && t.priority !== priority) return false;
    if (owner && t.owner !== owner && !t.owner.includes(owner)) return false;
    if (category && t.cat !== category) return false;
    if (view === 'personal') {
      if (taskTypeMap[t.id] !== 'personal') return false;
    } else if (view === 'business') {
      if (taskTypeMap[t.id] !== 'business') return false;
    }
    return true;
  });
  renderAll(filtered);
}
