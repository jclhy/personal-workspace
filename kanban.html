<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>红业全量任务看板</title>
<style>
/* 登录遮罩 */
#loginOverlay { position: fixed; inset: 0; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); display: flex; align-items: center; justify-content: center; z-index: 9999; }
#loginBox { background: white; border-radius: 16px; padding: 40px; width: 360px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
#loginBox h2 { font-size: 20px; margin-bottom: 6px; color: #1d1d1f; }
#loginBox .login-sub { font-size: 13px; color: #86868b; margin-bottom: 24px; }
#loginBox input { width: 100%; padding: 12px 16px; border: 2px solid #e5e5e5; border-radius: 10px; font-size: 15px; outline: none; text-align: center; letter-spacing: 3px; transition: border-color 0.2s; }
#loginBox input:focus { border-color: #0f3460; }
#loginBtn { width: 100%; padding: 12px; background: #0f3460; color: white; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 16px; transition: background 0.2s; }
#loginBtn:hover { background: #16213e; }
#loginBtn:active { transform: scale(0.98); }
.login-error { color: #ff3b30; font-size: 13px; margin-top: 12px; min-height: 20px; }
#appContent { display: none; }
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f5f7; color: #1d1d1f; line-height: 1.5; }
.header { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); color: white; padding: 24px 32px; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 12px rgba(0,0,0,0.15); }
.header h1 { font-size: 22px; font-weight: 600; margin-bottom: 4px; }
.header .subtitle { font-size: 13px; opacity: 0.7; }
.controls { display: flex; gap: 12px; flex-wrap: wrap; padding: 16px 32px; background: white; border-bottom: 1px solid #e5e5e5; position: sticky; top: 72px; z-index: 99; }
.controls input, .controls select { padding: 8px 12px; border: 1px solid #d1d1d6; border-radius: 8px; font-size: 14px; outline: none; background: #fafafa; }
.controls input:focus, .controls select:focus { border-color: #0f3460; background: white; }
.controls input { flex: 1; min-width: 200px; }
.controls select { min-width: 130px; }
.stats-bar { display: flex; gap: 16px; padding: 12px 32px; background: white; border-bottom: 1px solid #e5e5e5; flex-wrap: wrap; }
.stat-chip { display: flex; align-items: center; gap: 6px; font-size: 13px; padding: 4px 12px; border-radius: 20px; background: #f5f5f7; }
.stat-chip .num { font-weight: 700; font-size: 16px; }
.stat-chip.completed .num { color: #34c759; }
.stat-chip.inprogress .num { color: #ff9500; }
.stat-chip.pending .num { color: #ff3b30; }
.stat-chip.total .num { color: #0f3460; }
.stat-chip.archived .num { color: #8e8e93; }

.main { padding: 20px 32px; }
.section { margin-bottom: 28px; }
.section-header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; cursor: pointer; user-select: none; }
.section-header h2 { font-size: 17px; font-weight: 600; }
.section-icon { width: 28px; height: 28px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 14px; color: white; flex-shrink: 0; }
.section-count { font-size: 12px; color: #86868b; background: #f0f0f0; padding: 2px 8px; border-radius: 10px; }
.section-toggle { font-size: 12px; color: #86868b; margin-left: auto; }
.section.collapsed .cards { display: none; }

.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
.card { background: white; border-radius: 12px; padding: 16px; border: 1px solid #e5e5e5; transition: all 0.2s; position: relative; }
.card:hover { border-color: #0f3460; box-shadow: 0 4px 16px rgba(15,52,96,0.1); transform: translateY(-1px); }
.card-top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 8px; }
.card-id { font-size: 11px; font-weight: 700; color: white; padding: 2px 8px; border-radius: 4px; letter-spacing: 0.5px; }
.card-title { font-size: 15px; font-weight: 600; margin-bottom: 6px; line-height: 1.4; }
.card-desc { font-size: 13px; color: #6e6e73; margin-bottom: 10px; line-height: 1.5; }
.card-meta { display: flex; flex-wrap: wrap; gap: 6px; }
.meta-tag { font-size: 11px; padding: 3px 8px; border-radius: 4px; display: inline-flex; align-items: center; gap: 3px; }

/* Status colors */
.status-completed { background: #e8f8ed; color: #1b7a3d; }
.status-inprogress { background: #fff4e0; color: #b36a00; }
.status-pending { background: #ffe5e5; color: #c41e3a; }
.status-notstarted { background: #f0f0f0; color: #6e6e73; }
.status-paused { background: #f0e6ff; color: #7b2d8e; }
.status-deferred { background: #f0f0f0; color: #86868b; }

/* Priority */
.priority-p0 { background: #ffe5e5; color: #c41e3a; font-weight: 700; }
.priority-p1 { background: #fff4e0; color: #b36a00; }
.priority-p2 { background: #e8f0ff; color: #2557a7; }
.priority-p3 { background: #f0f0f0; color: #6e6e73; }
.priority-deferred { background: #f0f0f0; color: #aaa; text-decoration: line-through; }

/* Category colors */
.cat-e { background: #c41e3a; }
.cat-c { background: #ff9500; }
.cat-t { background: #2557a7; }
.cat-ed { background: #34c759; }
.cat-b { background: #af52de; }
.cat-d { background: #8e8e93; }
.cat-l { background: #5ac8fa; }

.owner-tag { background: #f0f4ff; color: #2557a7; }
.source-tag { background: #f5f5f7; color: #86868b; }

.card-details { margin-top: 8px; padding-top: 8px; border-top: 1px solid #f0f0f0; font-size: 12px; color: #6e6e73; }
.card-details div { margin-bottom: 3px; }
.detail-label { color: #86868b; }

.no-results { text-align: center; padding: 60px 20px; color: #86868b; font-size: 15px; }

.footer { text-align: center; padding: 20px; font-size: 12px; color: #86868b; border-top: 1px solid #e5e5e5; margin-top: 40px; }

/* 归档面板 */
.archive-panel { background: #fafafa; border: 1px solid #e5e5e5; border-radius: 12px; padding: 20px 32px; margin: 0 32px 20px; }
.archive-panel h3 { font-size: 15px; font-weight: 600; margin-bottom: 12px; color: #6e6e73; }
.archive-controls { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.archive-controls select { padding: 6px 12px; border: 1px solid #d1d1d6; border-radius: 8px; font-size: 13px; background: white; }
.archive-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.archive-table th { text-align: left; padding: 8px 12px; background: #f0f0f0; font-weight: 600; color: #6e6e73; border-bottom: 2px solid #e5e5e5; }
.archive-table td { padding: 8px 12px; border-bottom: 1px solid #f0f0f0; }
.archive-table tr:hover td { background: #f5f5f7; }
.archive-empty { text-align: center; padding: 30px; color: #86868b; }

@media (max-width: 768px) {
  .header, .controls, .stats-bar, .main, .archive-panel { padding-left: 16px; padding-right: 16px; }
  .cards { grid-template-columns: 1fr; }
  .controls input { min-width: 150px; }
  .archive-panel { margin: 0 16px 20px; }
}
</style>
</head>

<script>
// 密码验证
const PWD_HASH = 'b961b62afaad57c885b92af580d6611a0729a0dca1cd15bad2dd61f6a77d3ecf';

async function sha256(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

async function checkPassword() {
  const input = document.getElementById('pwdInput').value;
  const hash = await sha256(input);
  if (hash === PWD_HASH) {
    sessionStorage.setItem('kanban_auth', '1');
    document.getElementById('loginOverlay').style.display = 'none';
    document.getElementById('appContent').style.display = 'block';
    loadArchiveData();
  } else {
    document.getElementById('loginError').textContent = '密码不正确，请重试';
    document.getElementById('pwdInput').value = '';
    document.getElementById('pwdInput').focus();
  }
}

document.getElementById('pwdInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') checkPassword();
});

if (sessionStorage.getItem('kanban_auth') === '1') {
  document.getElementById('loginOverlay').style.display = 'none';
  document.getElementById('appContent').style.display = 'block';
  loadArchiveData();
}



// ===== 从 kanban.md 加载数据 =====
async function loadKanbanData() {
  try {
    const resp = await fetch('kanban.md');
    if (!resp.ok) throw new Error('无法读取 kanban.md');
    const text = await resp.text();
    
    const codeBlocks = text.match(/\`\`\`javascript\n(.*?)\`\`\`/gs) || [];
    for (const block of codeBlocks) {
      const js = block.replace(/^\`\`\`javascript\n|\`\`\`$/g, '').trim();
      eval(js);
    }
    
    sessionStorage.setItem('kanban_auth', '1');
    document.getElementById('loginOverlay').style.display = 'none';
    document.getElementById('appContent').style.display = 'block';
    loadArchiveData();
    renderAll();
  } catch (err) {
    console.error('加载 kanban.md 失败:', err);
    document.getElementById('loginError').textContent = '数据加载失败: ' + err.message;
  }
}

// Override password check to also load from MD
document.addEventListener('DOMContentLoaded', function() {
  const origBtn = document.getElementById('loginBtn');
  if (origBtn) {
    origBtn.onclick = async function() {
      const input = document.getElementById('pwdInput').value;
      const hash = await sha256(input);
      if (hash === PWD_HASH) {
        sessionStorage.setItem('kanban_auth', '1');
        document.getElementById('loginOverlay').style.display = 'none';
        document.getElementById('appContent').style.display = 'block';
        loadKanbanData();
      } else {
        document.getElementById('loginError').textContent = '密码不正确，请重试';
        document.getElementById('pwdInput').value = '';
        document.getElementById('pwdInput').focus();
      }
    };
  }
  
  // Auto-unlock if already authenticated
  if (sessionStorage.getItem('kanban_auth') === '1') {
    document.getElementById('loginOverlay').style.display = 'none';
    document.getElementById('appContent').style.display = 'block';
    loadKanbanData();
  }
});

      status: "已封存",
      priority: "高",
      quadrant: "重要且紧急",
      category: "个人话题",
      project: "个人探索",
      archived_date: "2026-07-19",
      note: "有明确商业机会，需做原型演示。2026-07-11由红业决定封存，待重启后恢复。"
    }
  ];
  
  populateArchiveMonths();
  renderArchive();
}

function populateArchiveMonths() {
  const months = [...new Set(ARCHIVED_TASKS.map(t => t.archived_date?.substring(0, 7) || 'unknown'))].sort().reverse();
  const select = document.getElementById('archiveMonthFilter');
  months.forEach(m => {
    const opt = document.createElement('option');
    opt.value = m;
    opt.textContent = m === 'unknown' ? '未知日期' : m + '月';
    select.appendChild(opt);
  });
}

function renderArchive() {
  const monthFilter = document.getElementById('archiveMonthFilter').value;
  const search = document.getElementById('archiveSearchBox').value.toLowerCase();
  
  let filtered = ARCHIVED_TASKS;
  if (monthFilter) {
    filtered = filtered.filter(t => (t.archived_date || '').startsWith(monthFilter));
  }
  if (search) {
    filtered = filtered.filter(t => 
      t.id.toLowerCase().includes(search) || 
      t.name.toLowerCase().includes(search) ||
      (t.project || '').toLowerCase().includes(search) ||
      (t.note || '').toLowerCase().includes(search)
    );
  }
  
  const container = document.getElementById('archiveTableContainer');
  
  if (filtered.length === 0) {
    container.innerHTML = '<div class="archive-empty">📭 暂无匹配的归档任务</div>';
    return;
  }
  
  const statusBadge = (status) => {
    const map = {
      '已完成': 'status-completed',
      '已封存': 'status-paused',
      '暂停': 'status-paused'
    };
    return `<span class="meta-tag ${map[status] || ''}">${status}</span>`;
  };
  
  let html = `<table class="archive-table">
    <thead>
      <tr>
        <th>ID</th>
        <th>任务名称</th>
        <th>状态</th>
        <th>优先级</th>
        <th>所属项目</th>
        <th>归档日期</th>
      </tr>
    </thead>
    <tbody>`;
  
  filtered.sort((a, b) => (b.archived_date || '').localeCompare(a.archived_date || ''));
  
  filtered.forEach(t => {
    html += `<tr>
      <td><strong>${t.id}</strong></td>
      <td>${t.name}</td>
      <td>${statusBadge(t.status)}</td>
      <td>${t.priority}</td>
      <td>${t.project || '—'}</td>
      <td>${t.archived_date || '—'}</td>
    </tr>`;
  });
  
  html += '</tbody></table>';
  html += `<div style="margin-top:12px;font-size:12px;color:#86868b;">共 ${filtered.length} 条归档记录</div>`;
  
  container.innerHTML = html;
}

function toggleArchive() {
  const panel = document.getElementById('archivePanel');
  panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
}

// ========== 看板渲染 ==========
const SECTIONS = [
  { cat:"E", title:"消耗型任务", subtitle:"必须做，优先清掉", icon:"🔥", color:"#c41e3a" },
  { cat:"C", title:"建设型·内容资产", subtitle:"长期价值最高", icon:"📚", color:"#ff9500" },
  { cat:"T", title:"建设型·技术项目", subtitle:"产品与技术", icon:"⚙️", color:"#2557a7" },
  { cat:"ED", title:"建设型·教育业务", subtitle:"教育产品与合作", icon:"🎓", color:"#34c759" },
  { cat:"B", title:"建设型·商业变现", subtitle:"收入与客户", icon:"💰", color:"#af52de" },
  { cat:"D", title:"已完成/维持型", subtitle:"保持运行即可", icon:"✅", color:"#8e8e93" },
  { cat:"L", title:"个人成长/学习", subtitle:"基础与支撑", icon:"🌱", color:"#5ac8fa" },
  { cat:"DEV", title:"开发项目与Agent管理", subtitle:"项目、设备、工具环境索引", icon:"🛠️", color:"#7b2d8e" },
];

const STATUS_MAP = { "✅":"completed", "⏳":"inprogress", "🔴":"pending", "❌":"notstarted", "⏸️":"paused", "⚠️":"deferred" };
const PRIORITY_MAP = { "P0":"p0", "P1":"p1", "P2":"p2", "P3":"p3", "暂缓":"deferred" };

// ========== 开发项目管理渲染 ==========
function renderDevSection() {
  const catColor = "#7b2d8e";
  let cardsHtml = DEV_PROJECTS.map(t => {
    const sc = t.status === "🔄" ? "inprogress" : (STATUS_MAP[t.status]||"pending");
    let detailsHtml = '';
    if (t.details && Object.keys(t.details).length > 0) {
      detailsHtml = '<div class="card-details">';
      for (const [k,v] of Object.entries(t.details)) {
        detailsHtml += `<div><span class="detail-label">${k}：</span>${v}</div>`;
      }
      detailsHtml += '</div>';
    }
    return `
      <div class="card" data-id="${t.id}" data-cat="${t.cat}" data-status="${t.status}" data-search="${t.title} ${t.desc} ${t.env} ${t.tool}">
        <div class="card-top">
          <span class="card-id" style="background:${catColor}">${t.id}</span>
          <span class="meta-tag status-${sc}">${t.status} ${t.statusLabel}</span>
        </div>
        <div class="card-title">${t.title}</div>
        <div class="card-desc">${t.desc}</div>
        <div class="card-meta">
          <span class="meta-tag owner-tag">💻 ${t.env}</span>
          <span class="meta-tag source-tag">🔧 ${t.tool}</span>
        </div>
        ${detailsHtml}
      </div>`;
  }).join('');
  
  return `<div class="section" data-cat="DEV">
    <div class="section-header" onclick="toggleSection(this)">
      <div class="section-icon" style="background:${catColor}">🛠️</div>
      <h2>开发项目与Agent管理</h2>
      <span class="section-count">${DEV_PROJECTS.length}项</span>
      <span class="section-subtitle" style="font-size:13px;color:#86868b;margin-left:8px">项目、设备、工具环境索引</span>
      <span class="section-toggle">▼ 收起</span>
    </div>
    <div class="cards">${cardsHtml}</div>
  </div>`;
}

function renderStats(filtered) {
  const total = filtered.length;
  const completed = filtered.filter(t=>t.status==="✅").length;
  const inprogress = filtered.filter(t=>t.status==="⏳").length;
  const pending = filtered.filter(t=>t.status==="🔴"||t.status==="❌").length;
  const archivedCount = ARCHIVED_TASKS.length;
  document.getElementById('statsBar').innerHTML = `
    <div class="stat-chip total"><span class="num">${total}</span>活跃</div>
    <div class="stat-chip completed"><span class="num">${completed}</span>已完成</div>
    <div class="stat-chip inprogress"><span class="num">${inprogress}</span>进行中</div>
    <div class="stat-chip pending"><span class="num">${pending}</span>待推进</div>
    <div class="stat-chip archived"><span class="num">${archivedCount}</span>已归档</div>
  `;
}

function renderCard(t) {
  const sc = STATUS_MAP[t.status]||"pending";
  const pc = PRIORITY_MAP[t.priority]||"p3";
  const catColor = SECTIONS.find(s=>s.cat===t.cat)?.color||"#999";
  
  // DEV 类别专用渲染
  if (t.cat === "DEV") {
    let detailsHtml = '';
    if (t.details && Object.keys(t.details).length > 0) {
      detailsHtml = '<div class="card-details">';
      for (const [k,v] of Object.entries(t.details)) {
        detailsHtml += `<div><span class="detail-label">${k}：</span>${v}</div>`;
      }
      detailsHtml += '</div>';
    }
    return `
      <div class="card" data-id="${t.id}" data-cat="${t.cat}" data-status="${t.status}" data-search="${t.title} ${t.desc} ${t.env} ${t.tool}">
        <div class="card-top">
          <span class="card-id" style="background:${catColor}">${t.id}</span>
          <span class="meta-tag status-${sc}">${t.status} ${t.statusLabel}</span>
        </div>
        <div class="card-title">${t.title}</div>
        <div class="card-desc">${t.desc}</div>
        <div class="card-meta">
          <span class="meta-tag owner-tag">💻 ${t.env}</span>
          <span class="meta-tag source-tag">🔧 ${t.tool}</span>
        </div>
        ${detailsHtml}
      </div>`;
  }
  
  let detailsHtml = '';
  if (t.details) {
    detailsHtml = '<div class="card-details">';
    for (const [k,v] of Object.entries(t.details)) {
      detailsHtml += `<div><span class="detail-label">${k}：</span>${v}</div>`;
    }
    detailsHtml += '</div>';
  }
  return `
    <div class="card" data-id="${t.id}" data-cat="${t.cat}" data-status="${t.status}" data-priority="${t.priority}" data-owner="${t.owner}" data-search="${t.title} ${t.desc} ${t.owner} ${t.id}">
      <div class="card-top">
        <span class="card-id" style="background:${catColor}">${t.id}</span>
        <span class="meta-tag status-${sc}">${t.status} ${t.statusLabel}</span>
      </div>
      <div class="card-title">${t.title}</div>
      <div class="card-desc">${t.desc}</div>
      <div class="card-meta">
        <span class="meta-tag priority-${pc}">${t.priority==='暂缓'?'⏸️ 暂缓':'🎯 '+t.priority}</span>
        ${t.owner!=='—'?`<span class="meta-tag owner-tag">👤 ${t.owner}</span>`:''}
      </div>
      ${detailsHtml}
    </div>`;
}

function renderAll(filtered) {
  if (!filtered) filtered = TASKS;
  renderStats(filtered);
  const main = document.getElementById('mainContent');
  let html = '';
  let hasResult = false;
  
  // 先渲染开发项目管理（独立数据源）
  const devHtml = renderDevSection();
  if (devHtml) {
    hasResult = true;
    html += devHtml;
  }
  
  for (const sec of SECTIONS) {
    const secTasks = filtered.filter(t=>t.cat===sec.cat);
    if (secTasks.length === 0) continue;
    hasResult = true;
    html += `<div class="section" data-cat="${sec.cat}">
      <div class="section-header" onclick="toggleSection(this)">
        <div class="section-icon" style="background:${sec.color}">${sec.icon}</div>
        <h2>${sec.title}</h2>
        <span class="section-count">${secTasks.length}项</span>
        <span class="section-subtitle" style="font-size:13px;color:#86868b;margin-left:8px">${sec.subtitle}</span>
        <span class="section-toggle">▼ 收起</span>
      </div>
      <div class="cards">${secTasks.map(renderCard).join('')}</div>
    </div>`;
  }
  if (!hasResult) html = '<div class="no-results">🔍 没有匹配的任务，试试调整筛选条件</div>';
  main.innerHTML = html;
}

function toggleSection(header) {
  const section = header.parentElement;
  section.classList.toggle('collapsed');
  const toggle = header.querySelector('.section-toggle');
  toggle.textContent = section.classList.contains('collapsed') ? '▶ 展开' : '▼ 收起';
}

function filterCards() {
  const search = document.getElementById('searchBox').value.toLowerCase();
  const status = document.getElementById('statusFilter').value;
  const priority = document.getElementById('priorityFilter').value;
  const owner = document.getElementById('ownerFilter').value;
  const category = document.getElementById('categoryFilter').value;
  const filtered = TASKS.filter(t => {
    if (search && !(t.id.toLowerCase().includes(search) || t.title.toLowerCase().includes(search) || t.desc.toLowerCase().includes(search) || t.owner.includes(search))) return false;
    if (status && t.status !== status) return false;
    if (priority && t.priority !== priority) return false;
    if (owner && t.owner !== owner && !t.owner.includes(owner)) return false;
    if (category && t.cat !== category) return false;
    return true;
  });
  renderAll(filtered);
}

// Initial render
renderAll();
</script>
</body>
